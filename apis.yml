aid: lawtrades
name: LawTrades
description: >-
  LawTrades is a legal talent marketplace, founded in 2016, that matches companies with vetted
  independent attorneys, paralegals, and legal operations professionals on flexible, on-demand
  terms rather than through traditional law firms or ALSPs. The platform covers eleven practice
  areas — commercial contracts, corporate law, data privacy and cyber security, intellectual
  property, labor and employment, legal operations, litigation, M&A, product counsel, real
  estate, and regulatory compliance — and handles matching, work-log management, invoicing,
  payments, and real-time spend analytics in-product. A human-in-the-loop AI layer drafts
  documents and flags risk for lawyer review. LawTrades raised a $6M Series A backed by 500
  Global, Draper Associates, Social Capital, and AngelList. As of this enrichment pass the
  company publishes no public API, developer portal, SDKs, or machine-readable API description.
